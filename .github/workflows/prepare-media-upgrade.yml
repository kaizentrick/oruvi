name: Prepare isolated media upgrade
on:
  push:
    branches: [feat/system-media-desktop-widget]
    paths: [scripts/prepare-media-upgrade.py]
permissions:
  contents: write
concurrency:
  group: oruvi-prepare-media-upgrade
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'kaizentrick/oruvi' && github.ref == 'refs/heads/feat/system-media-desktop-widget'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/system-media-desktop-widget
          fetch-depth: 2
      - name: Apply exact source edits on feature branch and remove preparation files
        run: |
          test "$(git rev-parse HEAD^)" = aee5ac9252e6e972d83766d99f08864c4b959e89
          python3 scripts/prepare-media-upgrade.py
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/audit-source.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources scripts Resources README.md CHANGELOG.md THIRD_PARTY_NOTICES.md .github/workflows/prepare-media-upgrade.yml
          git commit -m 'feat: integrate system playback and desktop widget with existing Oruvi model'
          git push origin HEAD:refs/heads/feat/system-media-desktop-widget
