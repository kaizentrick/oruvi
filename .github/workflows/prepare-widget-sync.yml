name: Integrate widget data synchronization fix
on:
  push:
    branches: [fix/widget-playback-0101]
    paths: [scripts/prepare-widget-sync.py]
permissions:
  contents: write
concurrency:
  group: oruvi-widget-sync-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'kaizentrick/oruvi' && github.ref == 'refs/heads/fix/widget-playback-0101'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/widget-playback-0101
      - name: Apply exact source integration and remove temporary files
        run: |
          python3 scripts/prepare-widget-sync.py
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/audit-source.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources Resources scripts .github/workflows/prepare-widget-sync.yml CHANGELOG.md README.md
          git commit -m 'fix: await real widget playback data and verify cross-process delivery'
          git push origin HEAD:refs/heads/fix/widget-playback-0101
