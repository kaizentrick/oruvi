name: Inspect native WidgetKit integration
on:
  push:
    branches: [feat/native-widgetkit]
    paths: [.github/workflows/widgetkit-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Validate App Group access from signed bundles
        run: |
          WORK="$(mktemp -d)"; export WORK
          trap 'rm -rf "$WORK"' EXIT
          cat > "$WORK/Probe.swift" <<'SWIFT'
          import Foundation
          print("START", Bundle.main.bundleIdentifier ?? "nil")
          let group = "group.com.kaizentrick.Oruvi.WidgetProbe"
          if let url = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: group) {
              let file = url.appendingPathComponent("probe.txt")
              do {
                  if CommandLine.arguments.contains("write") {
                      try FileManager.default.createDirectory(at: url, withIntermediateDirectories: true)
                      try "oruvi-probe".write(to: file, atomically: true, encoding: .utf8)
                      print("PROBE WRITE OK")
                  } else {
                      let result = try String(contentsOf: file, encoding: .utf8)
                      print("PROBE READ", result == "oruvi-probe" ? "OK" : "FAIL")
                      try? FileManager.default.removeItem(at: file)
                  }
              } catch { print("PROBE ERROR", error.localizedDescription) }
          } else { print("PROBE NIL CONTAINER") }
          SWIFT
          xcrun swiftc "$WORK/Probe.swift" -o "$WORK/Probe"
          python3 - <<'PY'
          import os, pathlib, plistlib, shutil, subprocess
          root = pathlib.Path(os.environ['WORK'])
          for name in ['Writer', 'Reader']:
              app = root / (name + '.app')
              (app/'Contents/MacOS').mkdir(parents=True)
              shutil.copy(root/'Probe', app/'Contents/MacOS/Probe')
              info = {'CFBundleIdentifier':'com.kaizentrick.Oruvi.WidgetProbe.'+name, 'CFBundleName':name, 'CFBundleExecutable':'Probe', 'CFBundlePackageType':'APPL', 'CFBundleVersion':'1', 'LSUIElement':True}
              (app/'Contents/Info.plist').write_bytes(plistlib.dumps(info))
              ent = {'com.apple.security.application-groups':['group.com.kaizentrick.Oruvi.WidgetProbe']}
              if name == 'Reader': ent['com.apple.security.app-sandbox'] = True
              path = root/(name+'.plist'); path.write_bytes(plistlib.dumps(ent))
              subprocess.run(['codesign','--force','--sign','-','--entitlements',str(path),str(app)],check=True)
              try:
                  r = subprocess.run([str(app/'Contents/MacOS/Probe')] + (['write'] if name == 'Writer' else []), text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=10)
                  print(name, 'exit', r.returncode, r.stdout, flush=True)
              except subprocess.TimeoutExpired: print(name,'TIMED OUT',flush=True)
          PY
          echo '=== Local sandbox failure reasons ==='
          log show --last 1m --style compact --predicate 'process == "Probe" OR process == "secinitd"' 2>/dev/null | tail -35 || true
          echo '=== Official extension template ==='
          TEMPLATE="$(xcode-select -p)/Library/Xcode/Templates/Project Templates/MultiPlatform/Application Extension/Widget Extension.xctemplate"
          /usr/bin/plutil -p "$TEMPLATE/TemplateInfo.plist" | head -180
