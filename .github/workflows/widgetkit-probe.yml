name: Inspect native WidgetKit integration
on:
  push:
    branches: [feat/native-widgetkit]
    paths: [.github/workflows/widgetkit-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: SDK integration and signing diagnostics (no personal data)
        run: |
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          echo '=== App Intents metadata tool ==='
          xcrun appintentsmetadataprocessor --help || true
          echo '=== WidgetKit extension template ==='
          find "$(xcode-select -p)/Library/Xcode/Templates" -iname '*widget*' -maxdepth 8 -print || true
          echo '=== AppIntent host protocols ==='
          grep -A18 -B3 'protocol AudioPlaybackIntent\|protocol ForegroundContinuableIntent' "$SDK/System/Library/Frameworks/AppIntents.framework/Modules/AppIntents.swiftmodule/arm64e-apple-macos.swiftinterface" || true
          echo '=== Ad-hoc sandbox App Group probe ==='
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          cat > "$WORK/Probe.swift" <<'SWIFT'
          import Foundation
          let group = "group.com.kaizentrick.Oruvi.WidgetProbe"
          if let url = FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: group) {
              let file = url.appendingPathComponent("probe.txt")
              do {
                  if CommandLine.arguments.contains("write") {
                      try FileManager.default.createDirectory(at: url, withIntermediateDirectories: true)
                      try "oruvi-probe".write(to: file, atomically: true, encoding: .utf8)
                      print("PROBE WRITE OK")
                  } else {
                      let result = try String(contentsOf: file, encoding: .utf8)
                      print("PROBE READ", result == "oruvi-probe" ? "OK" : "FAIL")
                      try? FileManager.default.removeItem(at: file)
                  }
              } catch { print("PROBE ERROR", error.localizedDescription) }
          } else { print("PROBE NIL CONTAINER") }
          SWIFT
          xcrun swiftc "$WORK/Probe.swift" -o "$WORK/Writer"
          cp "$WORK/Writer" "$WORK/Reader"
          cat > "$WORK/Entitlements.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?><plist version="1.0"><dict><key>com.apple.security.app-sandbox</key><true/><key>com.apple.security.application-groups</key><array><string>group.com.kaizentrick.Oruvi.WidgetProbe</string></array></dict></plist>
          PLIST
          codesign --force --sign - --identifier com.kaizentrick.Oruvi.WidgetProbe.Writer --entitlements "$WORK/Entitlements.plist" "$WORK/Writer"
          codesign --force --sign - --identifier com.kaizentrick.Oruvi.WidgetProbe.Reader --entitlements "$WORK/Entitlements.plist" "$WORK/Reader"
          "$WORK/Writer" write & PID=$!; (sleep 8; kill "$PID" 2>/dev/null || true) & WATCH=$!; wait "$PID" || true; kill "$WATCH" 2>/dev/null || true
          "$WORK/Reader" & PID=$!; (sleep 8; kill "$PID" 2>/dev/null || true) & WATCH=$!; wait "$PID" || true; kill "$WATCH" 2>/dev/null || true
      - name: Read official interactivity and lifecycle documentation
        run: |
          for page in creating-a-widget-extension adding-interactivity-to-widgets-and-live-activities keeping-a-widget-up-to-date; do
            echo "=== $page ==="
            curl --fail --silent --location --max-time 15 "https://developer.apple.com/tutorials/data/documentation/widgetkit/$page.md" | head -200 || true
          done
