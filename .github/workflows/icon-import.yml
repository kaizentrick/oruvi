name: Prepare approved Oruvi icon
on:
  push:
    branches: [fix/icon-delivery-091]
    paths:
      - '.github/icon-import/**'
      - '.github/workflows/icon-import.yml'
permissions:
  contents: read
jobs:
  icon:
    runs-on: macos-26
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify transfer and produce native PNG and ICNS on GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/icon-import/prepare.py
      - name: Keep the generated artwork for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Oruvi-approved-icon
          path: |
            Resources/OruviIcon.png
            Resources/OruviIcon.icns
            Resources/OruviIcon.json
          if-no-files-found: error
          retention-days: 7
