name: Preserve current icon in native widget integration
on:
  push:
    branches: [feat/native-widgetkit]
    paths: [.github/workflows/sync-native-widget.yml]
permissions:
  contents: write
jobs:
  sync:
    if: github.repository == 'kaizentrick/oruvi' && github.ref == 'refs/heads/feat/native-widgetkit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/native-widgetkit
          fetch-depth: 0
      - name: Merge pinned main update with explicit version conflict resolution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff c43fa11379c0814cf8ce968830fc0a3111860eb5 || true
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, plistlib
          main='c43fa11379c0814cf8ce968830fc0a3111860eb5'
          conflicts=set(subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines())
          assert conflicts <= {'Resources/Info.plist','Sources/Release.swift','scripts/build.sh'}, conflicts
          def read(ref,path): return subprocess.check_output(['git','show',ref+':'+path])
          p=plistlib.loads(read(main,'Resources/Info.plist'))
          ours=plistlib.loads(read('HEAD','Resources/Info.plist'))
          for key in ['CFBundleShortVersionString','CFBundleVersion','CFBundleURLTypes','OruviWidgetAppGroup']: p[key]=ours[key]
          assert p['CFBundleShortVersionString']=='0.10.0'
          assert 'OruviIcon' in p['CFBundleIconFile']
          Path('Resources/Info.plist').write_bytes(plistlib.dumps(p,sort_keys=False))
          text=read(main,'Sources/Release.swift').decode()
          assert text.count('?? "0.9.2"')==1
          Path('Sources/Release.swift').write_text(text.replace('?? "0.9.2"','?? "0.10.0"'))
          if 'scripts/build.sh' in conflicts:
              # Start with the CURRENT icon-aware build, then apply only WidgetKit edits.
              text=read(main,'scripts/build.sh').decode()
              def change(old,new):
                  global text
                  assert text.count(old)==1, old
                  text=text.replace(old,new)
              change('-framework EventKit -framework Sparkle)', '-framework EventKit -framework Sparkle -framework WidgetKit -framework AppIntents)')
              change('for source in Sources/*.swift; do','for source in Sources/*.swift Sources/WidgetShared/*.swift; do')
              change('APP="$BUILD/stage/Oruvi.app"; prepare_app "$APP"\nxcrun swiftc "${BASE[@]}" -O -whole-module-optimization "${RELEASE[@]}" "$BUILD/libOruviPlayers.a" "${FRAMEWORKS[@]}" -o "$APP/Contents/MacOS/Oruvi"', 'bash scripts/build-native-targets.sh "$BUILD" "$DEPS" "$VERSION" "$ORUVI_BUILD_NUMBER"\nAPP="$BUILD/stage/Oruvi.app"; prepare_app "$APP"\nEXTENSION="$APP/Contents/PlugIns/OruviWidgets.appex"\ncodesign --force "${SIGN_OPTIONS[@]}" --entitlements Resources/Widgets/Entitlements.plist --sign "${SIGN_IDENTITY:--}" "$EXTENSION"')
              change('    cp Resources/Info.plist "$app/Contents/Info.plist"', '''    python3 - "$app/Contents/Info.plist" <<'PLIST'
          import pathlib, plistlib, sys
          path = pathlib.Path(sys.argv[1])
          info = plistlib.loads(path.read_bytes()) if path.exists() else {}
          info.update(plistlib.loads(pathlib.Path('Resources/Info.plist').read_bytes()))
          path.write_bytes(plistlib.dumps(info, sort_keys=False))
          PLIST''')
              change('codesign --verify --deep --strict --verbose=2 "$APP"','codesign --verify --deep --strict --verbose=2 "$APP"\npython3 scripts/verify-native-bundle.py "$APP" >&3\nif [[ "${GITHUB_ACTIONS:-false}" == true ]]; then bash scripts/verify-widget-registration.sh "$APP" >&3; fi')
              change('codesign --verify --deep --strict "$BUILD/mount/Oruvi.app"','codesign --verify --deep --strict "$BUILD/mount/Oruvi.app"\npython3 scripts/verify-native-bundle.py "$BUILD/mount/Oruvi.app" >&3')
              Path('scripts/build.sh').write_text(text)
          assert 'ApplicationIcon.image()' in Path('Sources/OruviApplication.swift').read_text()
          assert 'build-native-targets.sh' in Path('scripts/build.sh').read_text()
          assert 'OruviIcon' in Path('scripts/build.sh').read_text()
          assert not Path('Resources/Luma.icns').exists()
          Path('.github/workflows/sync-native-widget.yml').unlink()
          PY
          git add Sources Resources scripts .github/workflows/sync-native-widget.yml
          test -z "$(git diff --name-only --diff-filter=U)"
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/audit-source.py
          git diff --cached --check
          git commit -m 'merge: preserve approved Oruvi icon and 0.10.0 native widget integration'
          git push origin HEAD:refs/heads/feat/native-widgetkit
