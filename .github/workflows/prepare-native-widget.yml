name: Integrate native WidgetKit targets
on:
  push:
    branches: [feat/native-widgetkit]
    paths: [scripts/prepare-native-widget.py, .github/workflows/prepare-native-widget.yml]
permissions:
  contents: write
concurrency:
  group: oruvi-native-widget-prepare
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'kaizentrick/oruvi' && github.ref == 'refs/heads/feat/native-widgetkit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/native-widgetkit
      - name: Integrate exact source edits and remove preparation code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/prepare-native-widget.py'); text=p.read_text()
          old="replace(tests, '        model.desktopWidgetEnabled = true', '        model.setNativeWidgetPresence(true)')"
          new="replace(tests, '        model.desktopWidgetEnabled = true\\n', '        model.setNativeWidgetPresence(true)\\n')"
          assert text.count(old)==1
          p.write_text(text.replace(old,new))
          PY
          python3 scripts/prepare-native-widget.py
          for script in scripts/*.sh; do bash -n "$script"; done
          python3 scripts/audit-source.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Sources Resources scripts .github README.md CHANGELOG.md
          git commit -m 'feat: integrate native macOS WidgetKit and remove desktop overlay'
          git push origin HEAD:refs/heads/feat/native-widgetkit
